<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的照片</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        h1 {
            margin: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .gallery img {
            width: 300px;
            height: auto;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        a {
            display: block;
            margin: 20px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>我的照片</h1>
    <div class="gallery">
        <img src="images/yourphoto1.jpg" alt="照片1">
        <img src="images/yourphoto2.jpg" alt="照片2">
        <!-- 可以继续加更多照片 -->
    </div>
    <a href="index.html">← 返回首页</a>
</body>
</html>
