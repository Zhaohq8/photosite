<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的照片网站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        h1 {
            margin-top: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .gallery img {
            width: 300px;
            height: auto;
            margin: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>我的照片网站</h1>
    <div class="gallery">
        <img src="images/photo1.jpg" alt="照片1">
        <img src="images/photo2.jpg" alt="照片2">
        <img src="images/photo3.jpg" alt="照片3">
    </div>
</body>
</html>
